# uaRO Graphics: RTX Remix settings for the uaRO client (uaro-graphics.ini: [renderer] remix = 1).
# Copy this file next to uaRO.exe together with RTX Remix (its d3d9.dll and .trex folder).
# The game draws its interface with screen-space vertices: Remix keeps them as the interface over its picture.
rtx.preTransformedVerticesIsUI = True
rtx.orthographicIsUI = True
# uaRO Graphics hands Remix the world in world space, turned to Direct3D's conventions: +y up and left-handed,
# like the view space of its camera.
rtx.zUp = False
rtx.leftHandedCoordinateSystem = True
