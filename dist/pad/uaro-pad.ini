; uaRO Pad settings. This file lives next to uaRO.exe.
; A missing key or a wrong value means the default. After editing by hand, restart the client.
; The Settings tab of the Start menu changes its own keys here; everything else stays as you wrote it.

[general]
enabled = 1             ; 0: the pad starts switched off (Back switches it on)
log_level = info        ; error | info | debug
language = en           ; the menu's language: en | uk | ru

[stick]
deadzone = 0.25         ; left stick dead zone (0.05-0.9)
walk_radius = 0.22      ; where walking "clicks": a share of the window's shorter side (0.05-0.45)
press = ring            ; ring: the left button goes down at the walking point at once; center: at the centre first

[mouse]
freedom = 1             ; 1: the mouse is not captured, the game cursor follows the Windows cursor
buttons = dinput        ; dinput | messages: how the pad's left click reaches the client
lock = 0                ; 1: the cursor cannot leave the game window while it is active (Alt+Tab, Win let it go)
focus_click = 0         ; 1: the click that activates the game window also acts in the game
middle = none           ; middle mouse button: none | F1 ... F9
button4 = none          ; mouse button 4 (back): none | F1 ... F9
button5 = none          ; mouse button 5 (forward): none | F1 ... F9

[window]
borderless = 0          ; 1: no title bar and borders (windowed mode only)
position = center       ; the borderless window: center | keep | X,Y (top-left corner of the picture)
background_sleep_ms = 10 ; while the game is behind other windows each frame sleeps this long (0-100, 0: never)

[target]
give_up_seconds = 4     ; drop a target when none of your hits has landed on it for this long
blacklist_seconds = 10  ; do not pick a dropped target again for this long
attack_interval_ms = 300

[skills]
ground_self = 12,25,27,70   ; Safety Wall, Pneuma, Warp Portal, Sanctuary: cast under yourself
traps = 115,116,117,118,119,120,121,122,123,125   ; hunter traps: placed 2 cells towards the target
repeat_ms = 250         ; a held slot button or LT fires again this often (0: no repeat, at least 150)

[aim]
mark = poison           ; how the target shows while it is the target (only you see it): poison | dpoison | curse | stun
                        ; | sleep | silence | sight | ruwach (states the client draws), gasp ("!" once when chosen), off

[rumble]
enabled = 1

[pad]
type = auto             ; auto: an Xbox controller if there is one, else a PlayStation one (DualShock 4, DualSense)
                        ; | xbox | sony

[sony]
lightbar = blue         ; the light bar: blue | red | green | purple | orange | white | off | RRGGBB (USB and Bluetooth)
touchpad = none         ; the touchpad's click: none | back (switches the pad off and on) | start (the menu)
