; uaRO Graphics - settings. Lines you do not change keep their defaults.
; uaro-graphics.exe (uaRO Graphics Settings) edits this file and keeps these comments.

[renderer]
; d3d12 = Direct3D 12: every feature (DLSS, effects, AI textures)
; d3d11 = Direct3D 11 for graphics cards without Direct3D 12 and Windows 7 and 8 (a test): the game, the
;         window's size, crisp text and the AI textures of the texture pack and upscaled.grf, no DLSS
;         or effects yet
; auto  = Direct3D 12, and Direct3D 11 where it cannot start, and the game's own look where neither can (2.12)
; system = uaRO Graphics switched off: the game draws itself (the gamepad and the launcher stay)
api = auto
; auto = the fast graphics card of several (a laptop's NVIDIA or AMD, not its integrated Intel);
;        or a card's name as the settings app's Renderer page lists them
gpu = auto
; 1 = draw in the 64-bit process uaro-render64.exe (a test; DLSS and frame generation will need it)
bridge = 0
; 1 = with Direct3D 11 draw on a thread of its own: the game's thread only writes each frame down (a test)
render_thread = 0
; 1 = draw through Direct3D 9 for NVIDIA RTX Remix (an experiment): its d3d9.dll and .trex folder next to
;     uaRO.exe, and rtx.conf from uaro-graphics\remix copied there; Alt+X opens Remix's menu
remix = 0

[display]
; auto       = as the game asks: a windowed game keeps its window (as ROExt sizes it), full screen
;              becomes a borderless window over the monitor (the monitor's mode never changes)
; borderless = always a borderless window over the whole monitor
; window     = always a normal window
mode = auto
; 1 = draw the game at the real pixels of its window: with Windows scaling (e.g. 175 % on a 4K monitor)
;     the world is sharper and the window and the interface keep their size; 0 = as version 0.2
high_resolution = 1
; 1 = HDR10 on a monitor with Windows' HDR on (Direct3D 12): white at 200 nits, the fires and sparks a little
;     brighter than white (a test; not with DLSS frame generation)
hdr = 0
; 1 = with render_scale over 100 % (Direct3D 12, no DLSS): the world drawn larger and made smaller, the interface
;     drawn at the screen's own pixels - sharper windows and text (a test)
ui_native = 0
; how enlarged interface pictures look: sharp = crisp pixels, smooth = soft
; (with crisp_text = 1 the windows themselves come from their crisp twins and stay crisp)
ui_filter = sharp
; 1 = the game's text, window frames and fills at the real pixels of the window when the game is enlarged
;     (Windows scaling, or render_scale above 100); 0 = as version 0.4
crisp_text = 1
; how crisp text enlarges the windows' buttons, tabs, frames and the labels drawn on them (0.41):
; xbr = sharp, letters one pixel thick kept whole; ai = the AI textures' network, softer (with
; [ai] ui_pieces = 1); pixels = as the game's pixels
window_art = xbr
; 0 = the main monitor, 1 = the second one, ...
monitor = 0
; the inner size of a normal window in pixels (mode = window, or auto with a windowed game);
; 0 = the size the game asks for
window_width = 0
window_height = 0

[quality]
; the frame is drawn this many % of the window's pixels, 100-200, and shrunk when shown:
; above 100 edges get smoother, the graphics card does more work (with high_resolution = 1)
render_scale = 100
; Direct3D 11, for weaker cards: the world drawn at this % of the picture, 50-100, and made larger with sharpening;
; the interface and the text stay sharp (100 = as it is, 75 = about half the pixels)
world_scale = 100
; the textures in their pictures' own colours (1), or 16-bit as the game makes them (0): glows, fire and the
; skills' particles without steps
full_colour = 1
; 1 = the super-light mode for the weakest graphics cards, over the rest while it is on: no effect, no AI
;     picture, the world at half size; with Direct3D 11 its textures as their colour alone, 16-bit (2.5.20)
super_light = 0
; sharpening of the picture on screen, 0-100: 0 = off, more = crisper detail; screenshots are not sharpened
sharpen = 50
; NVIDIA DLSS (GeForce RTX only; it starts the 64-bit renderer and replaces msaa):
; off, dlaa (smoothing at full resolution), quality, balanced, performance, ultra (the world drawn smaller)
dlss = off
; edge smoothing (MSAA): samples per pixel at the edges of models, walls and the ground:
; 0 = off, 2, 4 or 8 (more needs more video memory)
msaa = 4
; 1 = with msaa, soft edges where textures are cut out (leaves, fences): alpha to coverage
alpha_to_coverage = 1
; anisotropic filtering of the world: the ground and walls stay sharp at a slant; 0 = off, 2, 4, 8 or 16
; (best with the game's mipmaps on the Quality page of uaRO Graphics Settings)
anisotropy = 16
; in the game, Pause or Scroll Lock switches all improvements off and on, to compare

[effects]
; modern effects over the game's picture (the uaro renderer; they apply in a running game too)
; effects quality: auto (by the graphics card), off, weak (low), medium, strong (high), or custom (every switch below)
preset = auto
; the groups (2.6.22: by what the eye is on): 1 on, 0 off; and how strong each is, 0-200 %
; time - day, night and seasons; weather - rain, snow, sand; characters - characters and monsters;
; skill_effects - skills; fire - fire and smoke; lights - light; ground - ground and walls; plants - grass and
; trees; waters - water; creatures; caves - caves and dungeons; sky - sky and air; screen - the whole screen;
; game_fixes - fixes of the game's picture
group_time = 1
group_weather = 1
group_weather_strength = 100
group_characters = 1
group_characters_strength = 100
group_skill_effects = 1
group_skill_effects_strength = 100
group_fire = 1
group_fire_strength = 100
group_lights = 1
group_lights_strength = 100
group_ground = 1
group_ground_strength = 100
group_plants = 1
group_plants_strength = 100
group_waters = 1
group_waters_strength = 100
group_creatures = 1
group_caves = 1
group_sky = 1
group_sky_strength = 100
group_screen = 1
group_screen_strength = 100
group_game_fixes = 1
; 1 = the map's baked light (torch pools, shadows on the ground) smooth instead of blotches and steps
smooth_light = 1
; 1 = the maps' torches drawn anew: a burning flame with sparks, a soft glow around it, warm flickering light around
torch = 1
; 1 = the new flame; 0 = the game's own flame (the glow and the light around it stay new)
torch_flame = 1
; 0-200 %: how bright the new flame burns
torch_brightness = 100
; 0-200 %: the glow around the fire; 0-200 %: the light it throws on the ground and the walls; 0-100 %: its flicker
torch_glow = 100
torch_light = 100
torch_flicker = 50
; 1 = the chimneys' smoke billowing - wisps and gaps that rise - instead of the same small picture blown up
smoke = 1
; 0-200 %: how thick the smoke is
smoke_density = 100
; 1 = the lights the maps' makers placed light the characters and walls too, the fire-coloured ones flicker
lamps = 1
; 0-200 %: how bright the lamps' light is
lamps_light = 60
; 1 = fire walls, fire bolts and other fire-coloured skills light what is around them a little, as a torch
fire_light = 1
; 0-200 %: how much
fire_light_strength = 100
; 1 = the other skills light too, each in its colour: ice blue, lightning white, holy gold, poison green
skill_colours = 1
; 1 = the level 99 aura - its ring, bubbles and circle - shines softer, so that it does not dazzle
aura = 1
; 0-100 %: how bright the aura is, of what the game draws
aura_brightness = 50
; 1 = skills and the other effects of the game shine a little softer (not the maps' torches, smoke...)
skills_soft = 1
; 0-100 %: how bright, of what the game draws
skill_brightness = 80
; 1 = each of the maps' fireflies lights the map around its place like a lamp, in a colour of its own; also those
;     the maps' makers placed that the game never showed (3.0.7); 0 = the game's own fireflies as the game draws them
fireflies = 1
; 0-200 %: how bright the fireflies and their light are
fireflies_brightness = 100
; 1 = the fireflies themselves drawn in the air, glowing and flashing; 0 = only their light (3.0.7)
firefly_dots = 0
; 1 = glows, pools of light and dust the maps' makers placed but the game never showed (Manuk, Splendide,
;     Nidhoggur's nest, the towers), drawn from the map's file
map_glows = 1
; 0-200 %: how bright they and their light are
map_glows_brightness = 100
; 1 = their balls of light drawn floating in the air; 0 = only the light they throw (3.0.7)
map_glow_orbs = 0
; 1 = the forest's beams of light (Umbala, Geffenia, Glast Heim) soft at their ends, shimmering as through
;     moving leaves, with dust in them and light where they fall
rays = 1
; 0-200 %: how bright the beams and their light are
rays_brightness = 100
; 1 = lava (the Magma Dungeon) flows: its crust drifts, its cracks glow, its heat lights what is around it
lava = 1
; 0-200 %: how brightly the lava glows and lights around it
lava_brightness = 100
; 1 = the warps and the skill's portals glow around in soft blue, the air turns in them
portals = 1
; 0-200 %: how bright the glow, how strong the swirl
portals_strength = 100
; 1 = characters and monsters cast soft shadows the shape of their sprites, away from the light (a torch nearby,
;     else the sun), instead of the game's round spot
actor_shadows = 1
; 0-100 %: how dark
actor_shadows_strength = 55
; 1 = the picture shimmers over flames, burning skills, lava and far off in the desert
heat = 1
; 0-200 %: how much
heat_strength = 100
; 1 = the driver's own weather: snow over Lutie, leaves in Payon, sand about Morroc, rain over Niflheim and Einbroch
weather = 1
; 0-200 %: how much of it
weather_amount = 100
; 1 = soft shadows where surfaces meet: at walls, in corners, under trees (the characters keep their light)
ao = 0
; 0-100 %: how dark the shadows are, how far they reach from a corner
ao_strength = 60
ao_size = 50
; 1 = the light of skills, portals and lamps shines with a soft glow (bloom); the rest keeps its brightness
glow = 0
; how bright the glow is, 0-200 %; how far it spreads, 0-100 %
glow_strength = 100
glow_size = 50
; 0-100 %: how much the effects' light falls on the ground, walls and characters near them
glow_light = 50
; 1 = the maps' water drawn anew: waves, reflections, the sun's glints, the bed seen through it, foam
water = 0
; 0-100 %: how rough it is (0 = a still mirror), how much it reflects, how deep one sees into it
water_waves = 50
water_reflections = 50
water_clarity = 50
; 1 = the picture's colours to taste (not the interface's): saturation 0-200 %, contrast and brightness
;     50-150 % (100 = as the game), warmth 0-100 % (50 = as the game), vignette 0-100 %
grade = 0
grade_saturation = 115
grade_contrast = 108
grade_brightness = 100
grade_warmth = 50
grade_vignette = 25
; 0.64: the leaves of trees and bushes sway in the wind
foliage = 0
foliage_strength = 100
; 0.63: night - the world darker and colder, the torches, lamps and skills shining out of it; 2.6.19: always by
; the clock (clock below: from 20:00 to 6:00, an hour of dusk and of dawn), night_strength 0 = none
night_strength = 60
; 2.6.11: the time of day for all the effects - auto (the computer's clock), server (2.6.19: the server's day and
; night), or a moment that stays: dawn, morning, day, sunset, night
clock = auto
; 2.6.22: the season for all the effects - auto (the computer's calendar), or one that stays: spring, summer,
; autumn, winter
season = auto
; 2.6.22: the weather for all the effects - auto (the map's own: snow over Lutie, leaves in Payon's woods,
; sand about Morroc, rain over Niflheim and Einbroch), clear, or one under every open sky: rain, snow, leaves,
; sand
weather_kind = auto

[ai]
; 1 = on: the game's textures redrawn larger and sharper by a neural network (Real-ESRGAN) - the ready pictures
; of the texture pack uaro-textures.zip next to uaRO.exe, made once on the Texture pack page of uaRO Graphics
; Settings; a player's graphics card makes nothing. The Ready textures page shows and deletes the pack's pictures
enabled = 0
; what it improves, 1 = on: the maps' ground; buildings, trees and water; the sprites by their files - monsters
; (with pets, homunculi), players (bodies, heads, headgear, weapons), NPCs, items on the ground (pixel art the
; network may change too much); skill effects; the interface: icons and pictures in the game's windows (with
; crisp_text = 1), the loading screen and the login's backgrounds
ground = 1
objects = 1
monsters = 0
players = 0
npcs = 0
items = 0
; 2.5.23, 1 = on: clothes and hair in a dye (any colour the game gives them) from the pack's picture in the
; sprite's own colours, coloured as the dye; 0: a dyed character as the game draws it
dyes = 1
effects = 0
icons = 1
; with icons = 1: the windows' small pieces too - buttons, tabs, slots (the words on buttons get smoothed)
ui_pieces = 1
; the model for the ground and buildings, and the one for characters, effects and icons:
; general (realistic, keeps the texture's detail) or anime (drawn: smooth and clean, twice as fast)
; or (1.5) anime6b - drawn pictures with finer lines and their details kept, 5-7 times slower than general
model = general
sprite_model = anime
; 1.6, 2.5.28: a model for each group of pictures - general, anime, anime6b or gameai (Game AI 2.0, downloaded
; apart: get-models.bat) - the AI page's rows: model_ground_town, model_ground_field, model_ground_dungeon,
; model_ground_indoor, model_ground_other, model_buildings_town, model_models_field, model_models_dungeon,
; model_furniture, model_models_other, model_trees, model_plants, model_water, model_bodies, model_mounted,
; model_heads, model_weapons, model_shields, model_headgear, model_garments, model_monsters, model_bosses,
; model_homunculi, model_npcs, model_items_ground, model_item_icons, model_item_pictures,
; model_card_pictures, model_skill_animations, model_effect_sprites, model_emotions, model_cursor,
; model_windows, model_menu_icons, model_portraits, model_maps, model_loading, model_login. A group without
; one takes its family's - model_world, model_players, model_monsters, model_npcs, model_items, model_effects,
; model_icons, model_screens - and one without that model (the world) or sprite_model (the rest)
; 1.6.3: 1 = pictures smaller than small_side on both sides (the game's pixels) by small_model, whatever their group
small_pictures = 0
small_side = 48
small_model = anime
; how much of the textures' grain the general model smooths away, 0-100: 0 keeps it all (sand and grass stay
; crisp), 100 makes them smooth as if painted
denoise = 25
; the result: 4 or 2 times the game's texture (2 takes a quarter of the video memory: the pack's pictures halved)
scale = 4
; milliseconds of the graphics card's time a frame the neural network may take, 1-20 (with generate = 1)
budget = 2
; the textures of the world it takes, by their sides in pixels: from min_size to max_size, 16-1024
; (16 since 0.17: shadows and the small things of a map too)
min_size = 16
max_size = 512
; 1 = a map's textures the texture pack knows are taken from it as soon as the map loads
ahead = 1
; Direct3D 11: the pictures compressed in video memory (BC1/BC3, a quarter to an eighth of it): auto (a card under
; 3 GB), on, off
compress = auto
; 0.42: the textures come from the texture pack uaro-textures.zip in the game's folder (0.48: from it alone -
; upscaled.grf is not used any more); 1 = the network also makes in the game what it does not have yet and writes
; it into the pack (Direct3D 12; debugging: for the pack's maker)
; 1.5.8: a switch of its own - with enabled = 0 it makes every picture anew and keeps none (a model tried
; without touching the pack)
generate = 0

[frames]
vsync = 1
; frames per second at most; 0 = no limit (0.85: 60 - the game looks the same, the card works far less)
fps_limit = 60
; 1 = 15 frames a second while another window is in front or the game is minimised, 30 on the login and the
;     character select (0.85)
save_power = 1
; 1 = while a laptop runs on its battery: battery_fps frames at most, the effects at most the weak set's, the
;     world at 75 %, 5 frames when the game is minimised (2.5.20)
battery_saver = 0
battery_fps = 30
; 1 = the frame counter (fps, frame time) in the game window's corner from the start; Ctrl+Shift+F11 in the
;     game shows and hides it any time
fps_counter = 0
; NVIDIA DLSS frame generation: off, 2x, 3x or 4x frames shown per frame drawn (GeForce RTX 40 and 50; 3x and 4x
; RTX 50; only with dlss on)
frame_generation = off
; 1 = NVIDIA Reflex with DLSS: each frame waits until the graphics card is about to be free, and the game
;     reads the mouse only then - the cursor follows the mouse sooner (frame generation turns it on anyway)
reflex = 1
; 1 = let G-SYNC / FreeSync monitors show each frame as soon as it is ready
allow_tearing = 0

[sound]
; 0.91, the game's sound: rate = 44100 or 48000 Hz (the music as it was recorded; the game mixes at 22050 at
;     most), 0 = the game's
rate = 44100
; 1 = 48 sounds at once whatever setup.exe says
voices = 1
; % of the volume while another window is in front or the game is minimised (100 = as loud)
background = 30
; 1 = past six sounds at once each a little quieter: a crowd's skills do not crackle
limiter = 1
; 0.92: % of the way to the left or right a sound beside the character goes (0 = all in the middle, as the game)
stereo = 60
; 1 = every sound channel busy: the quietest stopped for a new sound (the game dropped the new one)
steal = 1
; 1 = the music fades from one map's piece into the next over 1.5 s
crossfade = 1
; 1.1: 1 = the sounds of monsters, skills and hits by uaRO Graphics' own engine (Windows 10 and later): around
;     you on any speakers, quieter and duller far off, with the place's echo
engine = 0
; the place's echo with the engine, 0-100
reverb = 60
; 1.2: 1 = with the engine, Windows' spatial sound (Windows Sonic for Headphones, Dolby Atmos) when it is on in
;     Windows: the sounds placed in three dimensions, in headphones too
headphones = 1
; 1.3: 1 = the music quieter (to 65 %) while many sounds play at once, back over two seconds
duck = 1
; 3.0.4-beta.1: the output device the music and the sounds play on - auto = as in Windows; else the device's
;     Windows id the settings app writes (while it is not connected: as in Windows until it is back)
output = auto
; 3.0.4-beta.7: ambience = 1 - the maps' own sounds (birds, brooks, waves, the wind, caves' drops) the game's
;     makers placed and this old client never played, each near its place; ambience_volume - their share of the
;     game's effects volume (%)
ambience = 0
ambience_volume = 60

[camera]
; 3.0.4-beta.5: indoor = 1 - inside buildings (inns, shops, guild halls, castles: data\indoorrswtable.txt) the
;     camera turns, tilts and zooms out as outdoors; 0 = the game's own lock. Ctrl+Alt+F12 in the game - the photo
;     mode: the interface, the cursor and the windows' panel hidden for a clean shot (Ctrl+Shift+F12).
indoor = 1

[buffs]
; 3.0.4-beta.6: timers = 1 - the time left on each buff icon at the screen's right edge (Blessing, Increase
;     AGI, the potions...), from the server's own data; 0 = the game's icons as they are.
timers = 1

[notify]
; 3.0.4-beta.3: 1 = while the game window is behind others or minimised, its taskbar button flashes and Windows
;     shows a notification - each kind its own box below
on = 1
whisper = 1
party = 1
trade = 1
guild = 1
friend = 1
death = 1
; 3.0.7: an attack on the character (once, again after half a minute without hits), a buff ending
;     (buff_seconds before), a death or HP under party_hp % in the party near, the party's and the
;     guild's chat, the character's name said near, the server gone; sound = Windows' own sound with each
attack = 1
; 3.0.7: HP and SP both back to recovered_percent % of their most (after one of them fell)
recovered = 1
recovered_percent = 100
buff_ending = 1
buff_seconds = 10
party_death = 1
party_low_hp = 1
party_hp = 30
party_chat = 1
guild_chat = 1
mention = 1
disconnect = 1
sound = 1

[debug]
; normal or verbose
log = normal

[report]
; 1 = when a game ends badly (the renderer would not start, the graphics card was lost, the game closed without
;     closing the renderer), send a report to the developers at uaro.kiev.ua after the game: the settings app's
;     Diagnostics page sends the same at a press. It holds uaro-graphics.ini, the logs and the computer's graphics
;     card, Windows and monitors - no login, no character, the Windows user name hidden.
auto = 0

[update]
; where uaRO Graphics updates come from (GitHub, kwebmn/ragnarok-graphics): release = the releases every player
; gets (the branch main); beta = the testers' builds first (the branch beta). No line: beta for a beta build,
; release otherwise - the settings app writes it at its start; the Service page switches it.

[client]
; our own libraries in place of the game's old ones: the settings app puts them in the game's folder, the
; game's own wait in uaro-graphics\original (1 = ours, 0 = the game's own; changed once the game is closed):
; cps = zlib, through which the game reads its archives (cps.dll); bink = Bink video, none in uaRO (binkw32.dll);
; ijl = the JPEG pictures - the loading screens read, Print Screen's shots written (ijl15.dll);
; mss = the game's sound, the effects and the music, over Windows' XAudio2 (mss32.dll; Windows 10 and later);
; roext = ROExt's work - the game's window, mouse buttons, keys, CPU, text code page - done by the driver, ROExt's
; dinput8.dll moved aside (its settings in [roext])
cps = 1
bink = 1
ijl = 1
mss = 1
roext = 1
; updates = the administrator's GRF archives in the updates folder (brought by the site's client update) mounted over
; the game's own archives, the newer name first (1 = on); the game's loose data\ files still come first
updates = 1

[roext]
; ROExt's settings, brought over from its dinput8.ini when its dinput8.dll goes aside ([client] roext = 1); read as
; the game starts. window_lock = the game's window borderless and locked in place: window_width x window_height at
; window_x, window_y when both sizes are set (the settings app's Screen page sets them), else over the screen but the
; taskbar; window_on_top = above the other windows; mouse_buttons = the 3rd-5th mouse buttons as F24, F23, F22 (skills
; can go on them); alt_f4 = Alt+F4 as F4 in the game, Alt+Print Screen closes it; minimize_key = Ctrl+W minimizes the
; game; free_cpu = ms the game waits for input while another window is active (0 = never); code_page = the game's
; text code page (-1 = Windows' own, 1251 = Cyrillic, 65001 = UTF-8). Scroll Lock never reaches the game, as with ROExt.
window_lock = 1
window_on_top = 0
window_x = 0
window_y = 0
window_width = 1600
window_height = 863
mouse_buttons = 0
alt_f4 = 0
minimize_key = 0
free_cpu = 4
code_page = -1

[windows]
; 3.0.3-beta.2, several game windows at once (applies at once): title_name = the character's name in the game window's
; title and on its taskbar button; remember_place = each character's window (one with a frame: window_lock = 0) where
; it was put - kept in uaro-graphics\uaro-windows.txt, the window goes there when the character comes into the game.
title_name = 1
remember_place = 1
; 3.0.3-beta.3: others_light = a game window while another one is the main (in front, or the last one in front) draws
; light: no effects, HD pictures or DLSS, half the render scale, 10 frames a second - whole again once it is the main;
; others_music = its music too (0 = the main window's music alone; their sounds stay, at [sound] background).
others_light = 1
others_music = 0
; 3.0.3-beta.9: others_sounds = the other game windows' sounds too (0 = the main window's alone).
others_sounds = 0
; 3.0.4-beta.4: start_count = the game windows the settings app's Play starts at once, one every 1.5 s (1-8): a
;     set for several characters; you log in to each yourself.
start_count = 1
; 3.0.3-beta.6: switch_keys = the keys that switch the game windows from inside the game (applies at once): all =
; Ctrl+Tab back to the window played in before, Ctrl+Alt+1...8 to the window of that number (the order they were
; started in); back = Ctrl+Tab alone; off. The game does not get the keys taken.
switch_keys = all

[interface]
; 3.0.11-beta.1: minimap = 1 - a test of the new interface's minimap: the game's own one is hidden (as Ctrl+Tab hides
; it) and a new one stands in its corner with the character's cell under it (compare it with /where); 0 = the game's
minimap = 0
; 3.0.11-beta.6: its hints from the game's reference (uaro-graphics\reference - fetched from uaro.kiev.ua when the game
; starts): minimap_npcs = 1 the NPCs as dots (the pointer over one names it), minimap_warps = 1 the warps to other maps
; as red rings, minimap_mobs = 1 the map's monsters under it (a star: a boss and its respawn); 0 = without
minimap_npcs = 1
minimap_warps = 1
minimap_mobs = 1
; 3.0.11-beta.65: minimap_reach = 1 - an experiment: the new minimap and its big map dim what you cannot reach on foot
; from where you stand (other floors, islands, ledges - by the server's map data; people and monsters not counted)
; minimap_reach = 0
; 3.0.11-beta.72: minimap_hd = 1 - the new minimap and its big map take the map's picture four times bigger when the
; game has one (the AI texture pack uaro-textures.zip, the old client's texture_x4.zip); 0 = the game's own 512 x 512
minimap_hd = 1
; 3.0.11-beta.74: pack_icons = 1 - the new interface's icons (skills, items, status effects) from the AI texture pack's
; pictures (uaro-textures.zip), four times the game's, where it has them; 0 = the game's own small icons
pack_icons = 1
; 3.0.11-beta.77: lock_layout = 1 - the new interface's parts stay where they are (no dragging them with the mouse, no
