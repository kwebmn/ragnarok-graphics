; uaRO Graphics - settings. Lines you do not change keep their defaults.
; uaro-graphics.exe (uaRO Graphics Settings) edits this file and keeps these comments.

[renderer]
; dgvoodoo = keep using dgVoodoo (it lives in the dgvoodoo folder next to the game)
; uaro     = the uaRO Graphics Direct3D 12 renderer (Windows 10 or newer; if it cannot start, the game
;            uses dgVoodoo and the log says why). use-uaro.bat and use-dgvoodoo.bat switch this line.
backend = dgvoodoo
; 1 = draw in the 64-bit process uaro-render64.exe (a test; DLSS and frame generation will need it)
bridge = 0
; 1 = draw through Direct3D 9 for NVIDIA RTX Remix (an experiment): its d3d9.dll and .trex folder next to
;     uaRO.exe, and rtx.conf from uaro-graphics\remix copied there; Alt+X opens Remix's menu
remix = 0

[display]
; auto       = as the game asks: a windowed game keeps its window (as ROExt sizes it), full screen
;              becomes a borderless window over the monitor (the monitor's mode never changes)
; borderless = always a borderless window over the whole monitor
; window     = always a normal window
mode = auto
; 1 = draw the game at the real pixels of its window: with Windows scaling (e.g. 175 % on a 4K monitor)
;     the world is sharper and the window and the interface keep their size; 0 = as version 0.2
high_resolution = 1
; how enlarged interface pictures look: sharp = crisp pixels, smooth = soft
; (with crisp_text = 1 the windows themselves come from their crisp twins and stay crisp)
ui_filter = sharp
; 1 = the game's text, window frames and fills at the real pixels of the window when the game is enlarged
;     (Windows scaling, or render_scale above 100); 0 = as version 0.4
crisp_text = 1
; 0 = the main monitor, 1 = the second one, ...
monitor = 0
; the inner size of a normal window in pixels (mode = window, or auto with a windowed game);
; 0 = the size the game asks for
window_width = 0
window_height = 0

[quality]
; the frame is drawn this many % of the window's pixels, 100-200, and shrunk when shown:
; above 100 edges get smoother, the graphics card does more work (with high_resolution = 1)
render_scale = 100
; sharpening of the picture on screen, 0-100: 0 = off, more = crisper detail; screenshots are not sharpened
sharpen = 50
; NVIDIA DLSS (GeForce RTX only; it starts the 64-bit renderer and replaces msaa):
; off, dlaa (smoothing at full resolution), quality, balanced, performance, ultra (the world drawn smaller)
dlss = off
; edge smoothing (MSAA): samples per pixel at the edges of models, walls and the ground:
; 0 = off, 2, 4 or 8 (more needs more video memory)
msaa = 4
; 1 = with msaa, soft edges where textures are cut out (leaves, fences): alpha to coverage
alpha_to_coverage = 1
; anisotropic filtering of the world: the ground and walls stay sharp at a slant; 0 = off, 2, 4, 8 or 16
; (best with the game's mipmaps on the Quality page of uaRO Graphics Settings)
anisotropy = 16
; in the game, Pause or Scroll Lock switches all improvements off and on, to compare

[effects]
; modern effects over the game's picture (the uaro renderer; they apply in a running game too)
; 1 = soft shadows where surfaces meet: at walls, in corners, under trees (the characters keep their light)
ao = 0
; 0-100 %: how dark the shadows are, how far they reach from a corner
ao_strength = 60
ao_size = 50
; 1 = the light of skills, portals and lamps shines with a soft glow (bloom); the rest keeps its brightness
glow = 0
; how bright the glow is, 0-200 %; how far it spreads, 0-100 %
glow_strength = 100
glow_size = 50
; 0-100 %: how much the effects' light falls on the ground, walls and characters near them
glow_light = 50
; 1 = the maps' water drawn anew: waves, reflections, the sun's glints, the bed seen through it, foam
water = 0
; 0-100 %: how rough it is (0 = a still mirror), how much it reflects, how deep one sees into it
water_waves = 50
water_reflections = 50
water_clarity = 50

[ai]
; experiment, 1 = on: the game's textures redrawn larger by a neural network (Real-ESRGAN) on the graphics card
; while you play, a little every frame; done ones are kept in upscaled.grf next to uaRO.exe and show at once next
; time (it starts the 64-bit renderer); the AI textures pages of uaRO Graphics Settings show and delete them
enabled = 0
; what it improves, 1 = on: the maps' ground; buildings, trees and water; the sprites by their files - monsters
; (with pets, homunculi), players (bodies, heads, headgear, weapons), NPCs, items on the ground (pixel art the
; network may change too much); skill effects; the interface: icons and pictures in the game's windows (with
; crisp_text = 1), the loading screen and the login's backgrounds
ground = 1
objects = 1
monsters = 0
players = 0
npcs = 0
items = 0
effects = 0
icons = 1
; with icons = 1: the windows' small pieces too - buttons, tabs, slots (the words on buttons get smoothed)
ui_pieces = 1
; the model for the ground and buildings, and the one for characters, effects and icons:
; general (realistic, keeps the texture's detail) or anime (drawn: smooth and clean, twice as fast)
model = general
sprite_model = anime
; how much of the textures' grain the general model smooths away, 0-100: 0 keeps it all (sand and grass stay
; crisp), 100 makes them smooth as if painted
denoise = 25
; the result: 4 or 2 times the game's texture (2 takes a quarter of the video memory and of upscaled.grf)
scale = 4
; milliseconds of the graphics card's time a frame the neural network may take, 1-20
budget = 2
; the textures of the world it takes, by their sides in pixels: from min_size to max_size, 16-1024
; (16 since 0.17: shadows and the small things of a map too)
min_size = 16
max_size = 512
; 1 = a map's textures seen there before are made (or taken from upscaled.grf) as soon as it loads
ahead = 1

[frames]
vsync = 1
; frames per second at most; 0 = no limit
fps_limit = 0
; NVIDIA DLSS frame generation: off, 2x, 3x or 4x frames shown per frame drawn (GeForce RTX 40 and 50; 3x and 4x
; RTX 50; only with dlss on)
frame_generation = off
; 1 = let G-SYNC / FreeSync monitors show each frame as soon as it is ready
allow_tearing = 0

[debug]
; normal or verbose
log = normal
