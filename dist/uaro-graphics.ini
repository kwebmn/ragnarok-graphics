; uaRO Graphics - settings. Lines you do not change keep their defaults.
; The settings app (coming in a later version) edits this file and keeps these comments.

[renderer]
; dgvoodoo = keep using dgVoodoo (it lives in the dgvoodoo folder next to the game)
; uaro     = the uaRO Graphics Direct3D 12 renderer (Windows 10 or newer; if it cannot start, the game
;            uses dgVoodoo and the log says why). use-uaro.bat and use-dgvoodoo.bat switch this line.
backend = dgvoodoo

[display]
; auto       = as the game asks: a windowed game keeps its window (as ROExt sizes it), full screen
;              becomes a borderless window over the monitor (the monitor's mode never changes)
; borderless = always a borderless window over the whole monitor
; window     = always a normal window
mode = auto
; 1 = draw the game at the real pixels of its window: with Windows scaling (e.g. 175 % on a 4K monitor)
;     the world is sharper and the window and the interface keep their size; 0 = as version 0.2
high_resolution = 1
; how enlarged interface pictures look: sharp = crisp pixels, smooth = soft
ui_filter = sharp
; 1 = the game's text, window frames and fills at the real pixels of the window when the game is enlarged
;     (Windows scaling, or render_scale above 100); 0 = as version 0.4
crisp_text = 1
; 0 = the main monitor, 1 = the second one, ...
monitor = 0
; the inner size of a normal window in pixels (mode = window, or auto with a windowed game);
; 0 = the size the game asks for
window_width = 0
window_height = 0

[quality]
; the frame is drawn this many % of the window's pixels, 100-200, and shrunk when shown:
; above 100 edges get smoother, the graphics card does more work (with high_resolution = 1)
render_scale = 100
; sharpening of the picture on screen, 0-100: 0 = off, more = crisper detail; screenshots are not sharpened
sharpen = 50
; in the game, Pause or Scroll Lock switches all improvements off and on, to compare

[frames]
vsync = 1
; frames per second at most; 0 = no limit
fps_limit = 0
; 1 = let G-SYNC / FreeSync monitors show each frame as soon as it is ready
allow_tearing = 0

[debug]
; normal or verbose
log = normal
